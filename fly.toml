# TacticalQuest — déploiement Fly.io.
#
# `app` doit correspondre exactement à l'app créée par `fly apps create`, sinon
# `fly deploy` vise une app qui ne vous appartient pas et échoue sur
# « unauthorized » — le message ne dit pas laquelle.
#
# Les noms d'app sont globaux sur Fly : préférer `fly apps create <nom>` à
# `fly launch`, qui réécrit ce fichier et fait perdre la configuration
# ci-dessous (volume monté, HTTPS forcé, always-on, healthcheck).
app = "tacmesh"
primary_region = "cdg"   # Paris

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"     # = destination du volume monté ci-dessous

[http_service]
  internal_port = 3000
  force_https = true
  # Always-on : pas de scale-to-zero (c'est tout l'intérêt de l'offre payante).
  # L'état vit en RAM et n'est snapshotté que toutes les ~10 s, donc on ne veut
  # pas que la machine s'arrête entre deux sessions.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Volume persistant : survit aux redémarrages/redéploiements. Le snapshot y est
# écrit (DATA_DIR=/data -> /data/snapshot.json). À créer une fois :
#   fly volumes create tq_data --region cdg --size 1
[mounts]
  source = "tq_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # 256mb suffit probablement ; 512 par sécurité (socket.io).
